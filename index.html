<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Archive</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>

<body>

<main class="page">

    <header class="archive-header">

        <span class="archive-label">
            Archive
        </span>

        <span class="archive-status">
            Restricted
        </span>

    </header>


    <section>

        <div class="entry-number">
            SYSTEM NOTICE
        </div>


        <h1 class="title">
            Archive unavailable.
        </h1>


        <p class="body-text">

            The requested collection is not
            publicly indexed.

        </p>

    </section>


    <footer class="footer">

        <span>
            No public record
        </span>

        <span>
            Restricted archive
        </span>

    </footer>

</main>

</body>

</html>
