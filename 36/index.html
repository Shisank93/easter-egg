<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Entry 36</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>

<body>

<main class="page">

    <header class="archive-header">

        <span class="archive-label">
            Unlisted Archive
        </span>

        <span class="archive-status">
            Entry 36
        </span>

    </header>


    <section>

        <div class="entry-number reveal">
            ARCHIVE ENTRY — 36
        </div>


        <div class="metadata reveal delay-1">

            <div class="metadata-item">

                <span class="metadata-label">
                    Status
                </span>

                <span class="metadata-value">
                    Found
                </span>

            </div>


            <div class="metadata-item">

                <span class="metadata-label">
                    Classification
                </span>

                <span class="metadata-value">
                    Unlisted
                </span>

            </div>


            <div class="metadata-item">

                <span class="metadata-label">
                    Access
                </span>

                <span class="metadata-value">
                    Unexpected
                </span>

            </div>

        </div>


        <h1 class="title reveal delay-2">
            You noticed.
        </h1>


        <p class="subtitle reveal delay-3">
            You weren't supposed to notice this.
        </p>


        <p class="body-text reveal delay-4"
           style="margin-top: 40px;">

            But since you did...

        </p>


        <p
            class="body-text reveal"
            style="
                animation-delay: 4s;
                margin-top: 20px;
            "
        >

            there are three more.

        </p>


        <a
            href="../41/"
            class="secret-link reveal"
            style="animation-delay: 4.8s;"
        >

            41

        </a>

    </section>


    <footer class="footer">

        <span>
            No public record
        </span>

        <span>
            Entry 36
        </span>

    </footer>

</main>


<script src="../assets/js/script.js"></script>

</body>

</html>
